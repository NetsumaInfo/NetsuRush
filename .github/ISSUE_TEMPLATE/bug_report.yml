name: Signaler un bug
description: Quelque chose ne marche pas comme prévu
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Le plus simple reste **Paramètres ▸ Système ▸ Console ▸ Signaler un bug** dans
        l'application : le journal et les caractéristiques de la machine partent tout seuls.
        Ce formulaire est là si vous préférez GitHub, ou si l'application ne démarre pas.

  - type: dropdown
    id: module
    attributes:
      label: Module concerné
      options:
        - NetsuCut (découpe, détection de plans)
        - NetsuSearch (recherche de plans)
        - NetsuBoard (board de référence)
        - NetsuBook (carnet)
        - NetsuDraft (script)
        - NetsuLab (upscale, interpolation, roto)
        - NetsuTalk (voix, sous-titres)
        - NetsuPilot (chat IA)
        - NetsuBoost (optimisation)
        - NetsuBridge (transfert entre logiciels)
        - Paramètres
        - Installation / mise à jour
        - Panneau Adobe (Premiere, After Effects)
        - Je ne sais pas
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: Il se passe quoi ?
      description: Ce que vous attendiez, et ce qui arrive à la place.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. Ouvrir ...
        2. Cliquer sur ...
        3. Le bug apparaît
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Journal
      description: >
        Paramètres ▸ Système ▸ Console ▸ Exporter. Relisez-le avant de le coller :
        il contient des chemins de fichiers.
      render: text

  - type: input
    id: version
    attributes:
      label: Version de NetsuRush
      description: Paramètres ▸ À propos
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Windows, GPU et pilote
      placeholder: "Windows 11 24H2, RTX 4070, pilote 561.09"

  - type: input
    id: host
    attributes:
      label: Logiciel piloté et sa version
      placeholder: "DaVinci Resolve Studio 19.1 / Premiere Pro 2025 / aucun"
